<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoadGuard Admin Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dashboard-body">
  <aside class="sidebar">
    <a class="brand" href="/">RoadGuard <span>AI</span></a>
    <nav>
      <a class="active" href="/dashboard">Overview</a>
      <a href="#complaints">Complaints</a>
      <a href="/">Public form</a>
    </nav>
  </aside>
  <main class="dashboard-main">
    <header class="dashboard-header">
      <div>
        <span class="eyebrow">CONTROL CENTER</span>
        <h1>Complaint Dashboard</h1>
      </div>
      <a class="outline-button" href="/">+ New complaint</a>
    </header>

    <section class="stats-grid">
      <article><small>Total complaints</small><strong id="stat-total">0</strong></article>
      <article><small>Pending</small><strong id="stat-pending">0</strong></article>
      <article><small>Critical severity</small><strong id="stat-critical">0</strong></article>
      <article><small>Resolved</small><strong id="stat-resolved">0</strong></article>
    </section>

    <section id="complaints" class="table-section">
      <div class="table-toolbar">
        <h2>Prioritized complaints</h2>
        <div>
          <input id="search" type="search" placeholder="Search location or citizen">
          <select id="severity-filter">
            <option value="">All severity</option>
            <option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Citizen</th><th>Location</th><th>AI Severity</th><th>Priority</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="complaints-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <button id="close-modal" class="close-modal" type="button">x</button>
      <div id="modal-content"></div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
